services:
  mysql:
    image: mysql:8.4
    container_name: fieldguide-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fieldguide
      MYSQL_USER: fieldguide
      MYSQL_PASSWORD: fieldguide
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  redis:
    image: redis:7.4
    container_name: fieldguide-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
